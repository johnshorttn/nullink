<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest audit · Nullink</title>
<style>
:root{--bg:#0b0f14;--bg2:#121821;--border:#2a3442;--text:#e6edf3;--muted:#8b98a5;--accent:#6ea8fe}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
h1{font-size:1.15rem;margin:0}a{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px}
.bar input,.bar select,.bar button{font:inherit;min-height:36px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text)}
.bar input[type=search]{flex:1 1 180px;min-width:0}.bar .grow{flex:1 1 120px;min-width:0}
button{cursor:pointer}button.primary{border-color:var(--accent);color:var(--accent)}
.meta{padding:0 14px 6px;color:var(--muted);font-size:12px}
.scroll{overflow-x:scroll;margin:0 8px 16px;border:1px solid var(--border);border-radius:10px;scrollbar-width:auto;scrollbar-color:#6b7a8c #121821}
.scroll::-webkit-scrollbar{height:12px;display:block}.scroll::-webkit-scrollbar-track{background:#121821}
.scroll::-webkit-scrollbar-thumb{background:#6b7a8c;border-radius:6px;border:2px solid #121821}
table{border-collapse:collapse;min-width:860px;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;vertical-align:top}
th{background:var(--bg2);color:var(--muted);font-weight:600;position:sticky;top:0}
tr.grp td{background:#16202c;cursor:pointer;font-weight:600}tr.grp td .st{font-weight:400;color:var(--muted)}
tr.ev.hidden{display:none}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--border);font-size:12px}
.t-ok{color:#7ee2a8;border-color:#2f6b4a}.t-bad{color:#ff9a9a;border-color:#7a3434}.t-warn{color:#ffd27a;border-color:#7a5f2a}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.pager{display:flex;gap:8px;align-items:center;padding:0 14px 20px}
</style></head><body>
<header><h1>Guest audit</h1><span><a href="/#guest-access">← Guest access</a> · <a href="/">Nullink</a></span></header>
<div class="bar">
  <input id="q" type="search" placeholder="Search name, IP, ID…">
  <input id="rid" class="grow" placeholder="Request ID (GR-…)">
  <select id="ev"><option value="">All events</option></select>
  <input id="from" type="date" title="From date (UTC)"><input id="to" type="date" title="To date (UTC)">
  <select id="group"><option value="1">Group by request</option><option value="0">Flat list</option></select>
  <button id="apply" class="primary">Apply</button><button id="csv">Export CSV</button>
</div>
<div class="meta" id="meta">Loading…</div>
<div class="scroll" id="scroll"><table><thead><tr><th>Time (ET)</th><th>Event</th><th>Request</th><th>Guest</th><th>IP</th><th>Who</th><th>Scope</th><th>Details</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="pager"><button id="prev">‹ Newer</button><span id="pg"></span><button id="next">Older ›</button></div>
<script src="/guest-audit.js?v=a2"></script>
</body></html>
