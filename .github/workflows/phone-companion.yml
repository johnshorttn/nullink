name: Android phone companion

on:
  push:
    paths:
      - "android/phone-companion/**"
      - ".github/workflows/phone-companion.yml"
  pull_request:
    paths:
      - "android/phone-companion/**"
      - ".github/workflows/phone-companion.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        working-directory: android/phone-companion
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nullink-phone-debug-apk
          path: android/phone-companion/app/build/outputs/apk/debug/app-debug.apk
