<!doctype html><html><head><title>ChatGPT</title></head><body>
<nav><button data-testid="accounts-profile-button">J</button></nav>
<main id="thread"></main>
<div id="prompt-textarea" contenteditable="true" role="textbox" style="min-height:40px;border:1px solid #ccc"></div>
<button data-testid="send-button" id="send">Send</button>
<script>
const box = document.getElementById('prompt-textarea');
function send() {
  const t = box.innerText.trim(); if (!t) return;
  box.innerText = '';
  const a1 = document.createElement('article');
  a1.innerHTML = '<div data-message-author-role="user"></div>'; a1.firstChild.innerText = t;
  document.getElementById('thread').appendChild(a1);
  if (!location.pathname.startsWith('/c/')) history.pushState({}, '', '/c/123e4567-e89b-12d3-a456-426614174000');
  const a2 = document.createElement('article');
  a2.innerHTML = '<div data-message-author-role="assistant"><div class="markdown prose"></div></div>';
  document.getElementById('thread').appendChild(a2);
  const md = a2.querySelector('.markdown');
  const stop = document.createElement('button'); stop.setAttribute('data-testid','stop-button'); stop.innerText='Stop';
  document.body.appendChild(stop);
  const last = t.split('\n').filter(Boolean).pop();
  const words = ('Mock Jinx answer to: ' + last.slice(0, 60)).split(' ');
  let i = 0;
  const iv = setInterval(() => {
    md.innerHTML = '<p>' + words.slice(0, ++i).join(' ') + '</p>';
    if (i >= words.length) { clearInterval(iv); stop.remove();
      const c = document.createElement('button'); c.setAttribute('data-testid','copy-turn-action-button'); c.innerText='Copy';
      a2.appendChild(c); }
  }, 150);
}
box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
document.getElementById('send').onclick = send;
</script></body></html>
